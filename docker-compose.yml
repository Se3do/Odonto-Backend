services:
  postgres:
    image: postgres:17
    container_name: odonto-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: verySecurePassword123
      POSTGRES_DB: odonto_db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: